services:
  farmer-mate-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.farmer.kwiko.org/api/v1}
    container_name: farmer-mate-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - farmer-mate-edge

networks:
  farmer-mate-edge:
    external: true
    name: farmer-mate-edge

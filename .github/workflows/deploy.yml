
name: Deploy Farmer Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/farmer-admin
            GIT_SSH_COMMAND="ssh -i /root/.ssh/farmer_admin_deploy -o IdentitiesOnly=yes" git fetch origin main
            git reset --hard origin/main
            docker compose build farmer-mate-admin
            docker compose up -d --no-deps farmer-mate-admin
            sleep 10
            curl -f http://127.0.0.1:8082/
